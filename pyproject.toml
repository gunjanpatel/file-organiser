[project]
name = "file-organiser"
version = "0.1.0"
description = "Organise files into folders based on their file creation date."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.1.0",
]

[project.scripts]
organise = "main:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.18.0",
    "ruff>=0.14.13",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py311"
exclude = []

# 1. Enable flake8-bugbear (`B`) rules, in addition to the defaults.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

# 2. Avoid enforcing line-length violations (`E501`)
ignore = ["E501"]

# 3. Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

# 4. Ignore `E402` (import violations) in all `__init__.py` files, and in selected subdirectories.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
