name: Build Windows EXE

on:
  push:
    branches: [ main ]
    tags: ['v*']
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build file-organiser.exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip cache and .venv
        uses: actions/cache@v4
        with:
          path: |
            .pip-cache
            .venv
          key: ${{ runner.os }}-pip-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install uv and setup project environment
        run: |
          # create a workspace-local pip cache and point pip to it so cache action can store it
          $pipCache = Join-Path $PWD '.pip-cache'
          if (-Not (Test-Path $pipCache)) { New-Item -ItemType Directory -Path $pipCache | Out-Null }
          $env:PIP_CACHE_DIR = $pipCache
          python -m pip install --upgrade pip
          pip install uv
          uv sync
        shell: pwsh

      - name: Build one-file Windows exe with PyInstaller (via uv)
        run: |
          uv run pyinstaller --noconsole --onefile --windowed --name file-organiser --clean --noconfirm src/main.py
        shell: pwsh

      - name: Smoke-test built exe (start, wait, terminate)
        run: |
          $exe = 'dist\file-organiser.exe'
          if (-Not (Test-Path $exe)) { throw "Exe not found: $exe" }
          Write-Host "Launching $exe for a short smoke test"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 6
          try {
            $running = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
            if ($null -eq $running) { throw "Process did not remain running after start" }
            Write-Host "Process started (pid $($proc.Id)); stopping process"
            Stop-Process -Id $proc.Id -Force
            Write-Host "Smoke test passed"
          } catch {
            # Attempt to kill process if it exists
            try { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue } catch {}
            throw
          }
        shell: pwsh

      - name: Upload built exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: file-organiser-exe
          path: |
            dist/file-organiser.exe
          retention-days: 7

      - name: Publish exe to GitHub Release (create if missing)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          ASSET_PATH: dist/file-organiser.exe
          ASSET_NAME: file-organiser.exe
        run: |
          Write-Host "Publishing $env:ASSET_PATH to release for tag $env:TAG"
          $headers = @{ Authorization = "token $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json' }

          # Try to get existing release by tag
          $rel = $null
          try {
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:REPO/releases/tags/$env:TAG" -Headers $headers -Method Get -ErrorAction Stop
          } catch {
            Write-Host "Release for tag $env:TAG not found; will create it"
          }

          if ($null -eq $rel) {
            $body = @{ tag_name = $env:TAG; name = $env:TAG; body = 'Automated build: file-organiser.exe'; draft = $false; prerelease = $false } | ConvertTo-Json
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:REPO/releases" -Headers $headers -Method Post -Body $body -ContentType 'application/json'
            Write-Host "Created release id=$($rel.id)"
          } else {
            Write-Host "Found existing release id=$($rel.id)"
          }

          # Delete existing asset with same name (if any)
          if ($rel.assets) {
            foreach ($a in $rel.assets) {
              if ($a.name -eq $env:ASSET_NAME) {
                Write-Host "Deleting existing asset $($a.name) (id=$($a.id))"
                $delUrl = "https://api.github.com/repos/$env:REPO/releases/assets/$($a.id)"
                Invoke-RestMethod -Uri $delUrl -Headers $headers -Method Delete
              }
            }
          }

          # Upload asset via uploads.github.com
          $release_id = $rel.id
          $upload_url = "https://uploads.github.com/repos/$env:REPO/releases/$release_id/assets?name=$env:ASSET_NAME"
          Write-Host "Uploading asset to $upload_url"
          if (-Not (Test-Path $env:ASSET_PATH)) { throw "Asset not found: $env:ASSET_PATH" }
          # Use Invoke-WebRequest to upload binary
          Invoke-WebRequest -Uri $upload_url -Headers @{ Authorization = "token $env:GITHUB_TOKEN" } -Method Post -InFile $env:ASSET_PATH -ContentType 'application/octet-stream'
          Write-Host "Upload complete"
        shell: pwsh

      - name: Show dist contents (debug)
        if: ${{ always() }}
        run: |
          Write-Host "Contents of dist folder:"
          Get-ChildItem -Recurse -Force dist | ForEach-Object { Write-Host $_.FullName }
        shell: pwsh
